<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700&family=Noto+Sans+JP:wght@400;500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <title>AiGen-One | FDEとつくるAI業務プラットフォーム</title>
    <meta name="description" content="専門FDEが現場業務を理解し、Skills・Agents・業務アプリとして設計・実装。AI導入から現場定着、継続改善まで支援します。">
    <script type="module" crossorigin src="./assets/aigen-CQcV8yge.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/site.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.getElementById("root");
        const retryIntervalMs = 250;
        const maxAttempts = 80;
        let attempts = 0;

        const ensureDemoVideo = () => {
          attempts += 1;

          const main = root.querySelector("main");
          const hero = main && main.querySelector("section");
          if (!hero) return;

          const existingSection = root.querySelector(".demo-video-section");
          const existingIframe = existingSection && existingSection.querySelector(
            'iframe[src*="RSjTnCubr6U"]'
          );
          const existingShorts = existingSection && existingSection.querySelector(
            '.demo-shorts-grid'
          );
          if (existingIframe && existingShorts) return;

          // If React left only part of the injected section, replace that
          // incomplete node instead of creating a duplicate.
          if (existingSection) existingSection.remove();

          const section = document.createElement("section");
          section.className = "demo-video-section";
          section.setAttribute("aria-labelledby", "demo-video-title");
          section.innerHTML = `
            <div class="demo-video-inner">
              <p class="demo-video-eyebrow">PRODUCT MOVIE</p>
              <h2 id="demo-video-title">AiGen-Oneを動画で見る</h2>
              <div class="demo-video-frame">
                <iframe
                  src="https://www.youtube-nocookie.com/embed/RSjTnCubr6U?rel=0"
                  title="AiGen-One 紹介動画"
                  loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
              </div>
              <div class="demo-shorts" aria-labelledby="demo-shorts-title">
                <div class="demo-shorts-heading">
                  <p class="demo-video-eyebrow">SHORT MOVIES</p>
                  <h3 id="demo-shorts-title">ショート動画</h3>
                </div>
                <ul class="demo-shorts-grid" role="list">
                  <li><a class="demo-short-card" href="https://youtube.com/shorts/FRvYDCeY4sc?feature=share" target="_blank" rel="noopener noreferrer" aria-label="AiGen-One ショート動画 1をYouTubeで見る"><span class="demo-short-thumbnail"><img src="https://i.ytimg.com/vi/FRvYDCeY4sc/hqdefault.jpg" alt="AiGen-One ショート動画 1のサムネイル" loading="lazy"><span class="demo-short-play" aria-hidden="true">▶</span></span><span class="demo-short-label">Short movie 01</span></a></li>
                  <li><a class="demo-short-card" href="https://youtube.com/shorts/crTaPI7aDSs?feature=share" target="_blank" rel="noopener noreferrer" aria-label="AiGen-One ショート動画 2をYouTubeで見る"><span class="demo-short-thumbnail"><img src="https://i.ytimg.com/vi/crTaPI7aDSs/hqdefault.jpg" alt="AiGen-One ショート動画 2のサムネイル" loading="lazy"><span class="demo-short-play" aria-hidden="true">▶</span></span><span class="demo-short-label">Short movie 02</span></a></li>
                  <li><a class="demo-short-card" href="https://youtube.com/shorts/s6rt-ZhfYBo?feature=share" target="_blank" rel="noopener noreferrer" aria-label="AiGen-One ショート動画 3をYouTubeで見る"><span class="demo-short-thumbnail"><img src="https://i.ytimg.com/vi/s6rt-ZhfYBo/hqdefault.jpg" alt="AiGen-One ショート動画 3のサムネイル" loading="lazy"><span class="demo-short-play" aria-hidden="true">▶</span></span><span class="demo-short-label">Short movie 03</span></a></li>
                  <li><a class="demo-short-card" href="https://youtube.com/shorts/NF4y8nVA6Cs?feature=share" target="_blank" rel="noopener noreferrer" aria-label="AiGen-One ショート動画 4をYouTubeで見る"><span class="demo-short-thumbnail"><img src="https://i.ytimg.com/vi/NF4y8nVA6Cs/hqdefault.jpg" alt="AiGen-One ショート動画 4のサムネイル" loading="lazy"><span class="demo-short-play" aria-hidden="true">▶</span></span><span class="demo-short-label">Short movie 04</span></a></li>
                  <li><a class="demo-short-card" href="https://youtube.com/shorts/oB5WKp0E4jw?feature=share" target="_blank" rel="noopener noreferrer" aria-label="AiGen-One ショート動画 5をYouTubeで見る"><span class="demo-short-thumbnail"><img src="https://i.ytimg.com/vi/oB5WKp0E4jw/hqdefault.jpg" alt="AiGen-One ショート動画 5のサムネイル" loading="lazy"><span class="demo-short-play" aria-hidden="true">▶</span></span><span class="demo-short-label">Short movie 05</span></a></li>
                  <li><a class="demo-short-card" href="https://youtube.com/shorts/VPtGVQ6d1FM?feature=share" target="_blank" rel="noopener noreferrer" aria-label="AiGen-One ショート動画 6をYouTubeで見る"><span class="demo-short-thumbnail"><img src="https://i.ytimg.com/vi/VPtGVQ6d1FM/hqdefault.jpg" alt="AiGen-One ショート動画 6のサムネイル" loading="lazy"><span class="demo-short-play" aria-hidden="true">▶</span></span><span class="demo-short-label">Short movie 06</span></a></li>
                </ul>
              </div>
            </div>`;
          hero.insertAdjacentElement("afterend", section);
        };

        // Wait for React to create <main>, then keep checking for a bounded
        // period so a later render cannot permanently remove the video.
        const retryTimer = window.setInterval(() => {
          ensureDemoVideo();
          if (attempts >= maxAttempts) window.clearInterval(retryTimer);
        }, retryIntervalMs);
      })();
    </script>
    <script src="./assets/pricing-update.js"></script>
  </body>
</html>
